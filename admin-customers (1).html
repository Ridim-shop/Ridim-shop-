<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>গ্রাহক তালিকা | Ridim Shop Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-100 text-slate-900 flex flex-col min-h-screen">

  <!-- Admin Header -->
  <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-emerald-500 font-bold flex items-center justify-center text-white">R</div>
        <a href="/admin.html" class="font-extrabold text-lg text-white tracking-tight">Ridim Shop Admin</a>
      </div>

      <nav class="hidden md:flex items-center gap-6 text-xs font-bold text-slate-300">
        <a href="/admin.html" class="hover:text-emerald-400 transition">ড্যাশবোর্ড</a>
        <a href="/admin-products.html" class="hover:text-emerald-400 transition">পণ্য ম্যানেজমেন্ট</a>
        <a href="/admin-orders.html" class="hover:text-emerald-400 transition">অর্ডার সমূহ</a>
        <a href="/admin-customers.html" class="text-emerald-400 font-extrabold">কাস্টমার তালিকা</a>
      </nav>

      <div class="flex items-center gap-3">
        <a href="/index.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-2 rounded-lg font-bold transition">🌐 ওয়েবসাইট</a>
        <button id="admin-logout-btn" class="text-xs bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg font-bold">🚪 লগআউট</button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 space-y-6">
    
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-slate-200 pb-4">
      <div>
        <h1 class="text-2xl font-black text-slate-900">গ্রাহক তালিকা (Customer Directory)</h1>
        <p class="text-xs text-slate-500">আপনার স্টোরের সকল রেজিস্টার্ড ও অর্ডারকৃত গ্রাহকদের তালিকা</p>
      </div>
    </div>

    <!-- Customers Table Card -->
    <div class="bg-white rounded-3xl p-6 border border-slate-200 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-slate-50 text-[11px] font-bold text-slate-500 uppercase tracking-wider border-b border-slate-200">
              <th class="py-3 px-4">গ্রাহকের নাম</th>
              <th class="py-3 px-4">মোবাইল নম্বর</th>
              <th class="py-3 px-4">জেলা</th>
              <th class="py-3 px-4">মোট অর্ডার</th>
              <th class="py-3 px-4">মোট ক্রয়মূল্য</th>
            </tr>
          </thead>
          <tbody id="admin-customers-tbody">
            <!-- Rendered dynamically by js/admin.js -->
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <script type="module" src="/js/app.js"></script>
  <script type="module" src="/js/admin.js"></script>
</body>
</html>
